# AntiMicroX → MAV-GUI keyboard layout (same PWM mix).
#
# Stick 1: Up/Down W/S surge, Left/Right A/D yaw
# Stick 2: Up/Down ↑/↓ heave, Left/Right ←/→ roll
# D-pad:   Up/Down R/F pitch, Left/Right Q/E sway
#
# Verify indices if your pad differs: ros2 topic echo /joy

joy_thruster_teleop:
  ros__parameters:
    joy_topic: /joy
    thruster_topic: /auv/thruster_cmd
    deadzone: 0.04
    scale_us: 300.0
    require_arm: true
    # Hold/heartbeat rate; stick events publish thruster_cmd immediately.
    publish_hz: 50.0

    # Linux Xbox / xpad axes
    axis_surge: 1          # left stick Y  → W/S
    axis_yaw: 0            # left stick X  → A/D
    axis_heave: 4          # right stick Y → ↑/↓
    axis_roll: 3           # right stick X → ←/→
    axis_pitch: 7          # d-pad Y       → R/F
    axis_sway: 6           # d-pad X       → Q/E
    axis_heave_pos: -1     # unused (heave is on right stick)
    axis_heave_neg: -1

    # Raw stick-up / d-pad-left is often −1; invert so signs match GUI keys
    invert_surge: true     # stick up → surge + (W)
    invert_yaw: true       # stick left → yaw + (A)
    invert_heave: true     # stick up → heave + (↑)
    invert_roll: true      # stick left → roll + (←)
    invert_pitch: false    # d-pad up (−1) → pitch − (R nose-down)
    invert_sway: true      # d-pad left → sway + (Q)

    button_arm_toggle: 2   # X
    button_arm_hold: -1
    button_disarm: 1       # B
    button_neutral: 0      # A
