services:
  sookshma:
    image: aatmaj9/timi:2.0
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile_timi
    container_name: auv
    working_dir: /workspaces/mavlab
    user: "mavlab"
    runtime: nvidia
    privileged: true
    network_mode: host
    shm_size: "2g"
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    group_add:
      - dialout
      - video
      - plugdev
      - render
      - audio
      - "104"
      - "44"
    device_cgroup_rules:
      - 'c 166:* rmw'   # ttyACM*
      - 'c 188:* rmw'   # ttyUSB*
      - 'c 195:* rmw'   # nvidia devices
      - 'c 104:* rmw'   # DRI render nodes
      - 'c 81:* rmw'    # video4linux (v4l) devices
    environment:
      - DISPLAY= $DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspaces/mavlab/.devcontainer/cyclonedds.xml
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ..:/workspaces/mavlab
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/argus_socket:/tmp/argus_socket

  # Run rosbridge persistently (avoid GUI pkill/start churn).
  rosbridge:
    image: aatmaj9/timi:2.0
    restart: unless-stopped
    container_name: auv_rosbridge
    working_dir: /workspaces/mavlab
    user: "mavlab"
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspaces/mavlab/.devcontainer/cyclonedds.xml
    volumes:
      - ..:/workspaces/mavlab
  # Use the upstream launch file so rosapi_node starts too (GUI echo/plots need /rosapi/topic_type).
    command: bash -ic "ros2 launch rosbridge_server rosbridge_websocket_launch.xml max_message_size:=10000000"

  # MJPEG HTTP streams for MAV GUI (ROS topics unchanged).
  # Example: http://<vehicle-ip>:8080/stream?topic=/front/image_raw
  web_video_server:
    image: aatmaj9/timi:2.0
    restart: unless-stopped
    container_name: auv_web_video_server
    working_dir: /workspaces/mavlab
    user: "mavlab"
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspaces/mavlab/.devcontainer/cyclonedds.xml
    volumes:
      - ..:/workspaces/mavlab
    command: bash -ic "ros2 run web_video_server web_video_server --ros-args -p port:=8080"

  # Foxglove Studio sidecar (ws://<vehicle-ip>:8765). Does not replace rosbridge for MAV GUI.
  foxglove_bridge:
    image: aatmaj9/timi:2.0
    restart: unless-stopped
    container_name: auv_foxglove_bridge
    working_dir: /workspaces/mavlab
    user: "mavlab"
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspaces/mavlab/.devcontainer/cyclonedds.xml
    volumes:
      - ..:/workspaces/mavlab
    command: bash -ic "ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765"

  # Vehicle agent for MAV-GUI: sensors + USB/udev reads (avoids SSH per click).
  # Shares host PID/network with `auv` so process probes match the Sensors tab lights.
  vehicle_agent:
    image: aatmaj9/timi:2.0
    restart: unless-stopped
    container_name: auv_vehicle_agent
    working_dir: /workspaces/mavlab
    user: "mavlab"
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    group_add:
      - dialout
      - video
      - plugdev
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspaces/mavlab/.devcontainer/cyclonedds.xml
      - MAV_AGENT_PORT=9123
      - MAV_AUV_DIR=/workspaces/mavlab
    volumes:
      - ..:/workspaces/mavlab
      - /dev:/dev
    command: bash -lc "python3 /workspaces/mavlab/.devcontainer/mav_vehicle_agent.py"
