dwell_mission_3d:
  ros__parameters:
    odom_topic: "navigation/odometry"
    reference_topic: "/guidance/reference_3d"
    status_topic: "/mission/status"

    target_x: 0.0
    target_y: 0.0
    target_z: 1.0
    target_pitch_deg: 0.0
    target_yaw_deg: 0.0

    # Hold level at the point before the first roll cycle
    initial_hold_s: 10.0
    # Number of (10s hold + roll -45/0/+45) cycles
    cycles: 1
    # Station-keep duration at the start of each cycle (seconds)
    cycle_hold_s: 10.0
    # Time to hold each roll setpoint (seconds)
    roll_hold_s: 4.0

    kp_xy: 0.35
    u_max: 0.30
    v_max: 0.25
    w_gain: 0.70
    w_max: 0.25
    pos_tolerance: 0.15
